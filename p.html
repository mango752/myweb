        <script>
                let cart = []; // Simple cart array to store items

function updateCartCount() {
    const cartCountElement = document.getElementById('cart-count');
    cartCountElement.textContent = cart.length;
}

function addToCart(name, price) {
    cart.push({ name: name, price: price });
    updateCartCount();
    alert(`${name} added to cart! Total items in cart: ${cart.length}`);
    // You can extend this to update a cart display, localStorage, etc.
}

function viewCart() {
    if (cart.length === 0) {
        alert('Your cart is empty!');
    } else {
        let cartDetails = 'Cart Items:\n';
        let total = 0;
        cart.forEach(item => {
            cartDetails += `- ${item.name}: ${item.price}\n`;
            // Simple total calculation (assuming price without $)
            const priceNum = parseFloat(item.price.replace('$', ''));
            total += priceNum;
        });
        cartDetails += `\nTotal: $${total.toFixed(2)}`;
        alert(cartDetails);
    }
}

// Modal logic
const modal = document.getElementById('product-modal');
const closeModal = document.getElementById('close-modal');
const modalTitle = document.getElementById('modal-title');
const modalImg = document.getElementById('modal-img');
const modalPrice = document.getElementById('modal-price');
const modalInfo = document.getElementById('modal-info');
const buyNowBtn = document.getElementById('buy-now');

function openModal(title, img, price, info) {
    modalTitle.textContent = title;
    modalImg.src = img;
    modalImg.alt = title;
    modalPrice.textContent = price;
    modalInfo.textContent = info;
    modal.style.display = 'block';
}

closeModal.onclick = function() {
    modal.style.display = 'none';
};

window.onclick = function(event) {
    if (event.target == modal) {
        modal.style.display = 'none';
    }
};

// Buy Now button functionality (adds to cart and simulates purchase)
buyNowBtn.addEventListener('click', function() {
    const title = modalTitle.textContent;
    const price = modalPrice.textContent;
    addToCart(title, price);
    alert(`${title} purchased successfully! Check your cart for details.`);
    modal.style.display = 'none';
});

// Attach event listeners to initial products
document.querySelectorAll('.product').forEach(product => {
    const viewBtn = product.querySelector('.product-view-btn');
    const cartBtn = product.querySelector('.add-to-cart-btn');
    
    if (viewBtn) {
        viewBtn.addEventListener('click', function() {
            const title = product.querySelector('h3').textContent;
            const img = product.querySelector('img').src;
            const price = product.querySelector('p').textContent;
            const info = product.getAttribute('data-info');
            openModal(title, img, price, info);
        });
    }
    
    if (cartBtn) {
        cartBtn.addEventListener('click', function() {
            const title = product.querySelector('h3').textContent;
            const price = product.querySelector('p').textContent;
            addToCart(title, price);
        });
    }
});

// Add more products on "View More" click
document.getElementById('view-more').addEventListener('click', function() {
    const productList = document.getElementById('product-list');
    moreProducts.forEach(product => {
        const div = document.createElement('div');
        div.className = 'product';
        div.setAttribute('data-info', product.info);
        div.innerHTML = `
            <img src="${product.img}" alt="${product.name}">
            <h3>${product.name}</h3>
            <p>${product.price}</p>
            <div class="buttons">
                <button class="product-view-btn">View More</button>
                <button class="add-to-cart-btn">Add to Cart</button>
            </div>
        `;
        // Attach event listeners to the new buttons
        div.querySelector('.product-view-btn').addEventListener('click', function() {
            openModal(product.name, product.img, product.price, product.info);
        });
        div.querySelector('.add-to-cart-btn').addEventListener('click', function() {
            addToCart(product.name, product.price);
        });
        productList.appendChild(div);
    });
    this.style.display = 'none';
});

function back() {
    window.location.href = "/home";
}
