<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <title>Welcome to GadgetHub</title>
        <style>
                body {
                        font-family: 'Segoe UI', Arial, sans-serif;
                        background: linear-gradient(120deg, #e0e7ef 0%, #f8fafc 100%);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        height: 100vh;
                        margin: 0;
                        position: relative;
                        overflow: hidden;
                }
                .gadget-bg {
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100vw;
                        height: 100vh;
                        z-index: 0;
                        pointer-events: none;
                        overflow: hidden;
                }
                .gadget-bg img {
                        position: absolute;
                        opacity: 0.13;
                        width: 120px;
                        height: auto;
                        transition: opacity 0.3s, transform 0.5s;
                        cursor: pointer;
                }
                .gadget1 { top: 10%; left: 5%; transform: rotate(-15deg);}
                .gadget2 { top: 70%; left: 80%; transform: rotate(10deg);}
                .gadget3 { top: 60%; left: 20%; transform: rotate(-8deg);}
                .gadget4 { top: 20%; left: 70%; transform: rotate(18deg);}
                .gadget-bg img:hover {
                        opacity: 0.3;
                        transform: scale(1.2) rotate(10deg);
                }
                .nav-links {
                        position: fixed;
                        top: 32px;
                        left: 32px;
                        margin: 0;
                        z-index: 2;
                        display: flex;
                        gap: 10px;
                }
                .nav-link-btn {
                        text-decoration: none;
                        color: #1a4fa0;
                        margin: 0;
                        font-weight: bold;
                        transition: color 0.2s, transform 0.2s;
                        padding: 10px 22px;
                        border-radius: 8px;
                        background: #e3edfa;
                        box-shadow: 0 2px 8px rgba(26,79,160,0.06);
                        display: inline-block;
                        font-size: 1.1em;
                }
                .nav-link-btn:hover {
                        color: #fff;
                        background: #1a4fa0;
                        transform: scale(1.09);
                        box-shadow: 0 4px 16px rgba(26,79,160,0.13);
                }
                .welcome-container {
                        background: #fff;
                        padding: 48px 70px;
                        border-radius: 16px;
                        box-shadow: 0 6px 24px rgba(0,0,0,0.10);
                        text-align: center;
                        z-index: 1;
                        position: relative;
                        animation: fadeIn 1s;
                }
                @keyframes fadeIn {
                        from { opacity: 0; transform: translateY(-30px);}
                        to { opacity: 1; transform: translateY(0);}
                }
                h1 {
                        color: #1a4fa0;
                        margin-bottom: 18px;
                        font-size: 2.5em;
                        letter-spacing: 1px;
                        animation: popIn 1s;
                }
                @keyframes popIn {
                        0% { transform: scale(0.8); opacity: 0;}
                        80% { transform: scale(1.1);}
                        100% { transform: scale(1); opacity: 1;}
                }
                p {
                        color: #333;
                        font-size: 1.25em;
                        margin-bottom: 18px;
                }
                .featured-gadgets {
                        margin-top: 30px;
                        display: flex;
                        justify-content: center;
                        gap: 32px;
                }
                .gadget-card {
                        background: #f6fafd;
                        border-radius: 10px;
                        box-shadow: 0 2px 8px rgba(26,79,160,0.05);
                        padding: 18px 24px;
                        text-align: center;
                        transition: transform 0.2s, box-shadow 0.2s;
                        width: 140px;
                }
                .gadget-card:hover {
                        transform: translateY(-8px) scale(1.04);
                        box-shadow: 0 6px 24px rgba(26,79,160,0.13);
                }
                .gadget-card img {
                        width: 60px;
                        margin-bottom: 10px;
                }
                .gadget-card span {
                        display: block;
                        color: #1a4fa0;
                        font-weight: 600;
                        font-size: 1em;
                }
        </style>
</head>
<body>

        <script>
                // Interactive gadget images: bounce on click
                document.querySelectorAll('.gadget-bg img').forEach(img => {
                        img.addEventListener('click', function() {
                                this.style.transition = "transform 0.2s";
                                this.style.transform += " scale(1.4)";
                                setTimeout(() => {
                                        this.style.transform = this.style.transform.replace(" scale(1.4)", "");
                                }, 200);
                        });
                });

                // Welcome message changes on hover
                const welcomeMsg = document.getElementById('welcome-msg');
                const welcomeTitle = document.getElementById('welcome-title');
                welcomeTitle.addEventListener('mouseover', () => {
                        welcomeMsg.textContent = "Explore trending gadgets, exclusive deals, and more!";
                });
                welcomeTitle.addEventListener('mouseout', () => {
                        welcomeMsg.textContent = "Discover the latest and coolest gadgets. Your one-stop shop for all things tech!";
                });
                function img1(){
                  window.location.href="/p";
                }
                function home(){
                        window.location.href="/home";
                }
        </script>
